<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <link rel="stylesheet" href="./style.css" />

    <title>NFT preview card component</title>

    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="img-container">
        <img src="./assets/images/image-equilibrium.jpg" alt="hero image" />
        <div class="cyan-overlay">
          <img src="./assets/images/icon-view.svg" alt="eye icon" />
        </div>
      </div>

      <div class="text">
        <h1 class="title">Equilibrium #3429</h1>

        <p class="desciption">
          Our Equilibrium collection promotes balance and calm.
        </p>

        <div class="ntf-info">
          <div class="ntf-price">
            <span
              ><img src="./assets/images/icon-ethereum.svg" alt="ethereum icon"
            /></span>
            <p>0.041 ETH</p>
          </div>
          <div class="ntf-duration">
            <img
              src="./assets/images/icon-clock.svg"
              alt="clock icon"
              class="clock"
            />
            <p>3 days left</p>
          </div>
        </div>

        <div class="horizontal-line"></div>

        <div class="author">
          <div class="avatar">
            <img src="./assets/images/avatar.jpg" alt="author avatar" />
          </div>
          <p class="author-name">Creation of <span>Hary300</span></p>
        </div>
      </div>
    </div>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="https://github.com/Hary300">Hary300</a>.
    </footer>
  </body>
</html>
